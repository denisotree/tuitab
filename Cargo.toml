[package]
name = "tuitab"
version = "0.5.0"
edition = "2021"
authors = ["denisotree"]
description = "Terminal tabular data explorer — CSV/JSON/YAML/TOML/Parquet/Excel/SQLite viewer with filtering, sorting, pivot tables, and charts"
license = "Apache-2.0"
repository = "https://github.com/denisotree/tuitab"
homepage = "https://github.com/denisotree/tuitab"
documentation = "https://docs.rs/tuitab"
readme = "README.md"
keywords = ["tui", "csv", "data", "terminal", "tabular"]
categories = ["command-line-utilities", "visualization"]
exclude = [
    "packaging/",
    ".github/",
    "docs/",
    ".githooks/",
    ".claude/",
]

[features]
default = ["bundled-duckdb"]
bundled-duckdb = ["duckdb/bundled"]

[[bin]]
name = "tuitab"
path = "src/main.rs"

[[bin]]
name = "ttab"
path = "src/bin/ttab.rs"

[[bin]]
name = "ttb"
path = "src/bin/ttb.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
color-eyre = "0.6"
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
bincode = "1"
arboard = { version = "3", default-features = false }
polars = { version = "0.53", default-features = false, features = ["csv", "lazy", "dtype-date", "dtype-datetime", "strings", "parquet", "serde", "pivot", "is_in"] }
libc = "0.2"
calamine = "0.36"
rusqlite = { version = "0.40", features = ["bundled"] }
duckdb = { version = "1" }
rust_xlsxwriter = "0.96"
serde_json = { version = "1", features = ["preserve_order"] }
rand = "0.10"
serde_yaml_ng = "0.10.0"
indexmap = "2.14.0"
toml_edit = "0.25.13"
jaq-core = "3.1.0"
# NB: trimming jaq-std's features here has no effect — jaq-json depends on it with
# defaults, and feature unification wins.  jiff, base64 and urlencoding come along.
jaq-std = "3.0.1"
jaq-json = "2.0.1"

[package.metadata.docs.rs]
# Build only for Linux x86_64. The default features bundle DuckDB and SQLite
# from source, so the crate compiles without any system C libraries.
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
# 17% of the binary is local symbols.  Dropping them costs symbol names in panic
# backtraces; the error chain color-eyre prints is unaffected, and packagers strip
# anyway.  Set to false when bisecting a crash.
strip = "symbols"
