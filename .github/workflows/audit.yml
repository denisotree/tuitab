name: Security audit

# tuitab is frozen, so nothing is pushed that would run CI: the schedule is what notices
# a new advisory against the released dependencies. CI calls this workflow too.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: |
          # RUSTSEC-2026-0194/0195: quick-xml denial-of-service advisories in XML parsing
          # of S3/Azure listing responses. Reached through
          #   polars/csv -> polars-stream -> polars-io/file_cache -> cloud
          #   -> object_store 0.13 -> quick-xml ^0.39
          # so it cannot be turned off without giving up CSV support, and ^0.39 cannot
          # resolve to the fixed 0.41 (0.39.4 is the last of its line, no backport).
          # polars 0.54 does not help — same object_store. object_store 0.14 DOES use
          # quick-xml 0.41, so the fix is one dependency bump inside polars; no released
          # polars has it yet. tuitab never makes a cloud request, so the code is linked
          # but never called. Drop these two the moment polars ships object_store 0.14.
          cargo audit \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195
      # GitHub suspends the schedule of a public repository after 60 days without
      # activity; enabling the workflow again resets that counter.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable audit.yml --repo "$GITHUB_REPOSITORY"
