name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04, as the Linux release builds: DuckDB 2.0 needs C++17, and a toolchain
        # newer than the release one would hide a build the release cannot do.
        os: [ubuntu-22.04, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # duckdb-rs#935: the cache restores DuckDB's unpacked sources without the
      # marker that says they are complete, and the bundled build then fails with
      # "Directory not empty". Unpacking again takes seconds. Drop once fixed upstream.
      - name: Drop cached DuckDB sources
        shell: bash
        run: rm -rf target/duckdb-sources target/*/duckdb-sources

      - name: Build
        run: cargo build --all-targets --locked

      - name: Run tests
        run: cargo test --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # duckdb-rs#935: the cache restores DuckDB's unpacked sources without the
      # marker that says they are complete, and the bundled build then fails with
      # "Directory not empty". Unpacking again takes seconds. Drop once fixed upstream.
      - name: Drop cached DuckDB sources
        shell: bash
        run: rm -rf target/duckdb-sources target/*/duckdb-sources
      - run: cargo clippy --all-targets --locked -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  audit:
    name: Security audit
    uses: ./.github/workflows/audit.yml
    permissions:
      contents: read
      actions: write
