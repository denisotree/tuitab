name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: tuitab
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds on 22.04 so the binary and the .deb need glibc 2.35 at
          # most: Debian 12 and Ubuntu 22.04 cannot run a 24.04 build.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            deb: true
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            deb: true
            cargo_build_jobs: "2"
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            cargo_build_jobs: "2"
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            cargo_build_jobs: "2"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          CARGO_BUILD_JOBS: ${{ matrix.cargo_build_jobs || '2' }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGING="${BIN_NAME}-${TAG}-${{ matrix.target }}"
          mkdir "$STAGING"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$STAGING/"
          cp README.md LICENSE "$STAGING/"
          tar -czf "${STAGING}.tar.gz" "$STAGING"
          echo "ASSET=${STAGING}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

      - name: Install cargo-deb
        if: matrix.deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      # Packaging metadata lives in Cargo.toml under [package.metadata.deb].
      - name: Package (.deb)
        if: matrix.deb
        shell: bash
        run: |
          cargo deb --no-build --locked --target ${{ matrix.target }} --output target/debian/
          echo "DEB=$(ls target/debian/*.deb)" >> "$GITHUB_ENV"

      - name: Upload .deb
        if: matrix.deb
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.target }}
          path: ${{ env.DEB }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history needed for git-cliff

      - name: Generate changelog for this release
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS || shasum -a 256 * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          # Just the one glob: SHA256SUMS is written into that directory a step
          # earlier, so naming it again uploaded it twice and the second upload
          # 404'd on the asset the first had already replaced — leaving the release
          # a draft with no checksums in it.
          files: artifacts/*
          body: ${{ steps.cliff.outputs.content }}
          fail_on_unmatched_files: true

  apt:
    name: APT repository
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/apt.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
